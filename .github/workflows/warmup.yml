name: Warmup API

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API health
        run: |
          for i in 1 2 3 4 5; do
            echo "Attempt $i"
            code=$(curl -s -o /dev/null -w "%{http_code}" https://quinto-set-api.onrender.com/health)
            echo "HTTP $code"
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then
              echo "API healthy ($code)"
              exit 0
            fi
            echo "API not ready, retrying..."
            sleep 20
          done
          echo "API unreachable after 5 attempts" >&2
          exit 1