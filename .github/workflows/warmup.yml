name: Warmup API

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API health
        run: curl -sf -o /dev/null -w "API health: %{http_code} (%{time_total}s)\n" https://quinto-set-api.onrender.com/health